name: LLM Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  code-review:
    name: AI Code Review
    runs-on: ubuntu-latest
    # Skip if the PR is from a bot or if commit message contains [skip-review]
    if: |
      !contains(github.event.pull_request.title, '[skip-review]') &&
      github.actor != 'dependabot[bot]' &&
      github.actor != 'renovate[bot]'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'

      - name: Install dependencies
        run: npm install @google/generative-ai

      - name: Get changed files & diff
        id: diff
        run: |
          git fetch origin ${{ github.base_ref }}
          # Get list of changed files (excluding lock files, generated files)
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD \
            | grep -Ev '\.(lock|snap|min\.js|min\.css|pb\.go|pb\.ts)$' \
            | grep -Ev '^(dist/|build/|vendor/|node_modules/)' \
            | head -30)

          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED_FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          # Get the diff (limit size to avoid token limits)
          git diff origin/${{ github.base_ref }}...HEAD -- \
            $(echo "$CHANGED_FILES" | tr '\n' ' ') \
            | head -c 30000 > /tmp/pr_diff.txt

          echo "Diff size: $(wc -c < /tmp/pr_diff.txt) bytes"

      - name: Run LLM Code Review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_DESCRIPTION: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          CHANGED_FILES: ${{ steps.diff.outputs.files }}
        run: node scripts/llm-review.js

      - name: Post review comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('/tmp/review_output.json', 'utf8');
            const { summary, comments, overallScore, recommendation } = JSON.parse(review);

            // Post a summary comment on the PR
            const scoreEmoji = overallScore >= 8 ? '✅' : overallScore >= 5 ? '⚠️' : '❌';
            const recEmoji = {
              'APPROVE': '✅',
              'REQUEST_CHANGES': '❌',
              'COMMENT': '💬'
            }[recommendation] || '💬';

            const body = [
              `## 🤖 AI Code Review`,
              ``,
              `**Score:** ${scoreEmoji} ${overallScore}/10 &nbsp;&nbsp; **Recommendation:** ${recEmoji} ${recommendation}`,
              ``,
              `### Summary`,
              summary,
              ``,
              review.isTruncated ? `> [!WARNING]\n> **Partial Review**: The PR diff or file list was truncated due to size limits. Some changes may not have been reviewed.` : '',
              ``,
              comments.length > 0 ? `### Findings (${comments.length})` : '',
              comments.map(c => [
                `#### ${c.severity === 'high' ? '🔴' : c.severity === 'medium' ? '🟡' : '🟢'} ${c.title}`,
                c.file ? `**File:** \`${c.file}\`` : '',
                c.description,
                c.suggestion ? `**Suggestion:** ${c.suggestion}` : '',
              ].filter(Boolean).join('\n')).join('\n\n'),
              ``,
              `---`,
              `*Powered by Google Gemini · [skip-review] in PR title to disable*`,
            ].filter(s => s !== undefined).join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });